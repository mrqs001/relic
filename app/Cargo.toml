[package]
name = "relic-app"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
publish = false

[lib]
name = "relic_app"
path = "src/lib.rs"

[[bin]]
name = "relic"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8", features = ["json", "query"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "signal", "time", "fs", "io-util"] }
tower-http = { version = "0.6", features = ["fs", "set-header", "compression-gzip"] }
rusqlite = { version = "=0.40.2", features = ["bundled", "backup", "functions", "hooks"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
md-5 = "=0.10.6"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
async-stream = "0.3"
dotenvy = "0.15"
futures-util = "0.3"
relic-telegram = { path = "../integrations/telegram" }
wreq = { version = "=0.16.1", features = ["stream"] }
url = "2"
unicode-normalization = "=0.1.25"
tempfile = "3"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
geo = { version = "=0.32.0", default-features = false }
rstar = "=0.12.2"
osmpbf = "=0.3.8"
libc = "0.2"
rayon = "1"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

[workspace]

[patch.crates-io]
osmpbf = { path = "../vendor/osmpbf" }
