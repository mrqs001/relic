[package]
name = "relic-telegram"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
publish = false

[dependencies]
grammers-client = { version = "=0.10.0", default-features = false }
grammers-mtsender = "=0.10.0"
grammers-session = { version = "=0.10.0", default-features = false, features = ["serde"] }
grammers-tl-types = { version = "=0.10.0", features = ["impl-serde"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "io-util"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
fs2 = "0.4"
zeroize = "1"
# rc1 changes num-bigint/API incompatibly; grammers 0.10 targets rc0.
glass_pumpkin = "=2.0.0-rc0"

[dev-dependencies]
tempfile = "3"

[workspace]
